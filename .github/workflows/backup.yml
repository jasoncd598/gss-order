name: Database backup

# Nightly copy of the live Supabase database, encrypted and kept for 30 days.
# The repository is public, so the dump is encrypted before upload — anyone
# signed in to GitHub can download a public repo's artifacts.
#
# Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL    Supabase → Connect → Session pooler connection string,
#                      with the database password filled in (the direct
#                      connection is IPv6-only and GitHub's runners can't reach it)
#   BACKUP_PASSPHRASE  a long random passphrase — keep a copy somewhere safe;
#                      without it the backups can't be opened
#
# Restore: see "Backups" in README.md.

on:
  schedule:
    - cron: '0 16 * * *' # 2–3am in Sydney
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump, encrypt and store
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning::Backups are not set up yet: add the SUPABASE_DB_URL and BACKUP_PASSPHRASE secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: latest

      # Supabase's recommended three-part dump: roles, schema, then data
      # (data includes sign-in accounts and the storage file index, not the files themselves)
      - name: Dump database
        if: steps.secrets.outputs.ready == 'true'
        run: |
          mkdir backup
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/data.sql --use-copy --data-only
          ls -la backup

      - name: Encrypt
        if: steps.secrets.outputs.ready == 'true'
        run: |
          name="gss-db-$(date -u +%Y-%m-%d)"
          tar -czf "$name.tar.gz" backup
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 -o "$name.tar.gz.gpg" "$name.tar.gz" <<< "$BACKUP_PASSPHRASE"
          rm -rf backup "$name.tar.gz"
          echo "BACKUP_NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: ${{ env.BACKUP_NAME }}
          path: ${{ env.BACKUP_NAME }}.tar.gz.gpg
          retention-days: 30
          if-no-files-found: error
